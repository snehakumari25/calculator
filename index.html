<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=charse">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">

        <h1>Tip Calculator</h1>

        <label for="bill">Bill Amount</label>
        <input type="number" id="bill" placeholder="Enter bill amount">

        <label for="tip">Tip Percentage</label>
        <input type="number" id="tip" placeholder="Enter tip %">

        <label for="people">Number of People</label>
        <input type="number" id="people" placeholder="Enter number of people">

        <button id="calculateBtn">Calculate</button>

        <div class="result">
            <p>Tip Per Person: ₹<span id="tipResult">0</span></p>
            <p>Total Per Person: ₹<span id="totalResult">0</span></p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
